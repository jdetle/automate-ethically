# Lints and builds every PR and push, without touching Azure. Fast, no secrets.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bunx astro check
      - run: bun run test:unit

      - run: bun run build

      # Reads the built HTML, so it judges what a visitor actually sees and
      # ignores code comments. Most of this site was machine-drafted; a site
      # arguing that a person should answer for what a machine produced can't
      # itself read like nobody checked.
      - run: bun run check:copy

      # Playwright, not the real Turnstile widget — see scripts/e2e-server.sh
      # for why: real Turnstile is designed to be unpassable by automation,
      # so this uses Cloudflare's official test keys instead. Regression
      # coverage for a real production incident (see tests/guide.e2e.spec.ts).
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
