# Builds the site image via an ACR Quick Task and rolls the container app.
#
# Runs on GitHub-hosted ubuntu-latest, not the platform's shared self-hosted
# fleet. It used to ask for `[self-hosted, linux, x64, azcaj]`, and because no
# runner was ever registered against this repo, every deploy run since the
# repo began queued on that label and was eventually cancelled — the site was
# only ever updated by running these commands by hand. Nothing in this job
# needs a self-hosted runner: `az acr build` builds server-side in ACR (no
# Docker daemon here), the ACR is publicly reachable, and the OIDC federated
# credential is scoped to the repo and ref, not to where the runner lives. The
# repo is public, so hosted minutes are free.
#
# To go back to the shared fleet, set `runs-on` below and complete the two
# manual GitHub-UI steps it depends on (neither can be done with a normal
# token): install the platform-ci-runner GitHub App on this repo, and add
# jdetle/automate-ethically to the gh-runner-pat fine-grained PAT's repository
# access list. Both live in jdetle/platform's setup. Until both are done, jobs
# queue on the self-hosted label but never pick up — which is the state this
# commit is fixing.
#
# Auth is OIDC federated credentials, not a stored AZURE_CREDENTIALS JSON
# blob: sp-automate-ethically-deploy trusts only
# repo:jdetle/automate-ethically:ref:refs/heads/main, and holds only
# AcrPush/Contributor on the shared platform ACR plus Contributor scoped to
# ca-automate-ethically itself — not the whole shared rg-platform.
#
# Repository secrets required:
#   AZURE_CLIENT_ID        sp-automate-ethically-deploy app (client) ID
#   AZURE_TENANT_ID
#   AZURE_SUBSCRIPTION_ID
#   PLATFORM_ACR            acrplatform….azurecr.io
#   ANTHROPIC_API_KEY   powers /api/guide (src/pages/api/guide.ts) — set as a
#                        Container Apps secret at deploy time, never baked
#                        into the image. Until this secret exists, the guide
#                        answers 503 and the rest of the site is unaffected.
#   OPENAI_API_KEY      powers /api/speech (src/pages/api/speech.ts), the
#                        guide's text-to-speech. Same treatment — a Container
#                        Apps secret, never baked in. Without it, the guide
#                        still works in text, just silently (no audio).
#   TURNSTILE_SECRET_KEY  the Cloudflare Turnstile secret half. Gates both
#                        /api/guide and /api/speech CLOSED — unlike the two
#                        keys above, an unset TURNSTILE_SECRET_KEY does not
#                        mean "skip the check," it means neither route runs
#                        at all, regardless of whether the AI keys are set.
#   PUBLIC_TURNSTILE_SITE_KEY  the Turnstile *site* key — not a secret (it's
#                        meant to be public, embedded in the page), but it
#                        still has to be passed as a build-arg, not a runtime
#                        env var: Vite inlines PUBLIC_-prefixed vars into the
#                        client bundle at build time (see Dockerfile).
#   S10_INGEST_KEY      the automate-ethically s10 ingest bearer key, minted by
#                        the platform repo's register-app-observability.sh. Set
#                        as a Container Apps secret and read by nginx at
#                        container start (docker-entrypoint.sh substitutes it
#                        into the /telemetry/ proxy header) — never baked into
#                        the image, because anything in the image is public.
#                        Unset means every beacon envelope is relayed with an
#                        empty bearer and rejected 401 upstream, which is
#                        exactly the state the site shipped in: instrumented
#                        on paper, silent in practice, and nothing said so.
#   SENTRY_DSN          server-side error tracking for the three on-demand
#                        routes (src/lib/sentry.ts, @sentry/node only — not
#                        @sentry/astro, which would inject a browser SDK into
#                        every page). Optional and fails silent: no DSN means
#                        no reporting, not a broken route. A DSN is meant to
#                        be public (it can only submit events, not read data),
#                        so unlike the keys above it's fine as a plain env var
#                        rather than a Container Apps secret.
name: deploy-azure

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One deploy at a time per ref: two overlapping runs would race on the
  # revision. Keyed by ref rather than a bare constant — a run that queues
  # against a runner label nothing answers can leave the group wedged, and
  # every later run then sits in `pending` with no jobs ever created, which
  # is what happened here for the whole life of the repo. A per-ref key also
  # means a manual dispatch can't be stuck behind an abandoned push.
  group: deploy-azure-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push the image
        env:
          PLATFORM_ACR: ${{ secrets.PLATFORM_ACR }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          set -euo pipefail
          ACR_NAME="${PLATFORM_ACR%%.*}"
          TAG="${GITHUB_SHA::7}"

          # Retried because the base image pull is the one step here that
          # fails for reasons that have nothing to do with this repo: the
          # Dockerfile pulls nginx and node from public.ecr.aws, and a shared
          # upstream registry answers "toomanyrequests: Rate exceeded"
          # whenever it feels like it. That took down a deploy of code that
          # was perfectly fine. Three attempts with backoff turns a coin flip
          # into a non-event; a genuine build error still fails all three and
          # still fails the run.
          for attempt in 1 2 3; do
            if az acr build --registry "$ACR_NAME" \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --build-arg "PUBLIC_TURNSTILE_SITE_KEY=$PUBLIC_TURNSTILE_SITE_KEY" \
              --image "automate-ethically:$TAG" --file Dockerfile .; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "ACR build failed three times" >&2
              exit 1
            fi
            echo "ACR build attempt ${attempt} failed; retrying in $((attempt * 30))s" >&2
            sleep $((attempt * 30))
          done

          echo "IMAGE=${PLATFORM_ACR}/automate-ethically:$TAG" >> "$GITHUB_ENV"

      - name: Roll the app
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          S10_INGEST_KEY: ${{ secrets.S10_INGEST_KEY }}
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes 2>/dev/null || true

          ENV_VARS=()

          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            az containerapp secret set \
              --name ca-automate-ethically --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --secrets "turnstile-secret-key=$TURNSTILE_SECRET_KEY" \
              --output none
            ENV_VARS+=("TURNSTILE_SECRET_KEY=secretref:turnstile-secret-key")
          else
            echo "TURNSTILE_SECRET_KEY not set — /api/guide and /api/speech will both answer 503 after this deploy, regardless of the AI keys below" >&2
            ENV_VARS+=("TURNSTILE_SECRET_KEY=")
          fi

          if [ -n "$ANTHROPIC_API_KEY" ]; then
            az containerapp secret set \
              --name ca-automate-ethically --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --secrets "anthropic-api-key=$ANTHROPIC_API_KEY" \
              --output none
            ENV_VARS+=("ANTHROPIC_API_KEY=secretref:anthropic-api-key")
          else
            echo "ANTHROPIC_API_KEY not set — /api/guide will answer 503 after this deploy" >&2
            ENV_VARS+=("ANTHROPIC_API_KEY=")
          fi

          if [ -n "$OPENAI_API_KEY" ]; then
            az containerapp secret set \
              --name ca-automate-ethically --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --secrets "openai-api-key=$OPENAI_API_KEY" \
              --output none
            ENV_VARS+=("OPENAI_API_KEY=secretref:openai-api-key")
          else
            echo "OPENAI_API_KEY not set — the guide will stay text-only after this deploy" >&2
            ENV_VARS+=("OPENAI_API_KEY=")
          fi

          # Read by docker-entrypoint.sh, not by the Node app: nginx needs it
          # to attach the ingest bearer server-side, because the beacon that
          # sends the envelope runs in a browser and a browser cannot keep a
          # secret. A secret ref, not a plain env var — this one really is one.
          if [ -n "$S10_INGEST_KEY" ]; then
            az containerapp secret set \
              --name ca-automate-ethically --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --secrets "s10-ingest-key=$S10_INGEST_KEY" \
              --output none
            ENV_VARS+=("S10_INGEST_KEY=secretref:s10-ingest-key")
          else
            echo "S10_INGEST_KEY not set — every telemetry envelope will be relayed with an empty bearer and rejected 401 upstream; the site will look instrumented and report nothing" >&2
            ENV_VARS+=("S10_INGEST_KEY=")
          fi

          # Not a secret ref: a DSN is meant to be public (it can only submit
          # events, never read data back), so it's a plain env var like
          # SENTRY_ENVIRONMENT below rather than going through
          # `containerapp secret set`.
          ENV_VARS+=("SENTRY_DSN=${SENTRY_DSN}")
          ENV_VARS+=("SENTRY_ENVIRONMENT=production")

          az containerapp update \
            --name ca-automate-ethically --resource-group rg-platform \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --image "$IMAGE" \
            --set-env-vars "${ENV_VARS[@]}" \
            --output none

      # A green deploy job used to mean "az returned 0", which is not the same
      # as "the new code is serving". This fails the run if the app is not
      # running the image we just pushed, or if the site does not answer.
      - name: Verify the revision is actually serving
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA::7}"

          for i in $(seq 1 30); do
            STATE=$(az containerapp show --name ca-automate-ethically \
              --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --query "properties.runningStatus" -o tsv)
            LIVE=$(az containerapp show --name ca-automate-ethically \
              --resource-group rg-platform \
              --subscription "$AZURE_SUBSCRIPTION_ID" \
              --query "properties.template.containers[0].image" -o tsv)
            [ "$STATE" = "Running" ] && [ "${LIVE##*:}" = "$TAG" ] && break
            sleep 10
          done

          if [ "${LIVE##*:}" != "$TAG" ]; then
            echo "app is on ${LIVE##*:}, expected $TAG" >&2
            exit 1
          fi

          FQDN=$(az containerapp show --name ca-automate-ethically \
            --resource-group rg-platform \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          for path in / /guide /search /act; do
            CODE=$(curl -sS -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 5 \
              --retry-all-errors "https://${FQDN}${path}")
            echo "${path} -> ${CODE}"
            [ "$CODE" = "200" ] || { echo "${path} answered ${CODE}" >&2; exit 1; }
          done

          echo "Site: https://${FQDN} (${TAG})" >> "$GITHUB_STEP_SUMMARY"

      # The tenant is registered, so this runs for real now. It exists
      # because a past integration 401'd silently on a malformed key — the
      # same failure the site then shipped with for its whole life, an empty
      # bearer rejected upstream while every page went on cheerfully firing
      # a beacon. Presence is not health: the only way to know a credential
      # works is to spend it, which is the same rule scripts/smoke-prod.sh
      # encodes for the API keys.
      - name: Smoke-test s10 ingest
        env:
          S10_INGEST_URL: https://ca-s10-ingest.purplewave-fe0ae338.eastus2.azurecontainerapps.io
          S10_INGEST_KEY: ${{ secrets.S10_INGEST_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$S10_INGEST_KEY" ]; then
            echo "S10_INGEST_KEY is not set as a repo secret — telemetry is not reaching s10" >&2
            exit 1
          fi
          # s10 wants a ULID for signal_id: ten time characters and sixteen
          # random ones, Crockford base32, as the beacon mints them.
          ulid() {
            local A=0123456789ABCDEFGHJKMNPQRSTVWXYZ t=$(date +%s%3N) s=""
            for _ in $(seq 1 10); do s="${A:$((t % 32)):1}$s"; t=$((t / 32)); done
            for _ in $(seq 1 16); do s="$s${A:$((RANDOM % 32)):1}"; done
            echo "$s"
          }
          RESP=$(curl -sS -X POST "$S10_INGEST_URL/v2/envelopes" \
            -H "Authorization: Bearer $S10_INGEST_KEY" \
            -H "Content-Type: application/x-ndjson" \
            --data-binary "{\"kind\":\"page\",\"tenant\":\"automate-ethically\",\"name\":\"/__ci-smoke-test\",\"signal_id\":\"$(ulid)\",\"occurred_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"context\":{\"pathname\":\"/__ci-smoke-test\"}}")
          echo "$RESP"
          echo "$RESP" | grep -q '"accepted":[1-9]' || { echo "s10 rejected the smoke envelope"; exit 1; }
