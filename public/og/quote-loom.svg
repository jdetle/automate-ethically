<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
	<rect width="1200" height="630" fill="#f3efe6"/>
	<g fill="#3b5386" opacity="0.14">
		<circle cx="60" cy="60" r="6"/>
		<circle cx="90" cy="60" r="6"/>
		<circle cx="60" cy="90" r="6"/>
		<circle cx="1140" cy="570" r="6"/>
		<circle cx="1110" cy="570" r="6"/>
		<circle cx="1140" cy="540" r="6"/>
	</g>
	<text x="120" y="230" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="40" fill="#232a38">The loom did not remove</text>
	<text x="120" y="288" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="40" fill="#232a38">the weaver. A person still</text>
	<text x="120" y="346" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="40" fill="#232a38">chose the pattern, punched</text>
	<text x="120" y="404" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="40" fill="#232a38">the cards, examined the</text>
	<text x="120" y="462" font-family="Georgia, 'Iowan Old Style', serif" font-style="italic" font-size="40" fill="#232a38">cloth, and signed the bolt.</text>
	<text x="120" y="520" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" letter-spacing="1" fill="#a04338">JACQUARD, 1804</text>
	<text x="120" y="580" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#5b6474">automate-ethically.com</text>
</svg>
