# Security headers, included by EVERY location block.
#
# This file exists because of an nginx footgun: `add_header` directives are
# inherited from an outer level ONLY IF the inner level defines none of its
# own. Every location here sets Cache-Control, so anything declared once at
# `server` level would be silently dropped on every real request — headers
# that look present in the config and never reach a browser. Including this
# file in each location is the boring way to make that impossible.

# Astro fingerprints its assets and pagefind ships WebAssembly, so scripts
# stay same-origin: no 'unsafe-inline' and no CDN, with exactly one named
# exception — challenges.cloudflare.com, for Turnstile on /guide. Turnstile
# has to load from Cloudflare's own edge to mean anything; self-hosting it
# would defeat the point. Nowhere else on the site gets this exception.
# 'unsafe-inline' remains on style-src only because `inlineStylesheets: "auto"`
# emits small <style> tags. form-action is 'none' because the site has no
# forms that submit anywhere — every call to action is a mailto: link or a
# JS-intercepted fetch. If Action Network forms land, this must change to
# name their origin, and the browser console will say so loudly.
add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com; manifest-src 'self'; upgrade-insecure-requests" always;

# All four hostnames in this zone are HTTPS-only and 301 from HTTP, so
# includeSubDomains is safe. `preload` is deliberately absent: submitting to
# the preload list is effectively irreversible and is not ours to decide here.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
