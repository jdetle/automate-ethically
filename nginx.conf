# Serves the built Astro site on 8080 as the non-root nginx user.
# pid and temp paths live in /tmp because /var/run and /var/cache/nginx are
# not writable once USER nginx drops privileges.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               image/svg+xml text/plain text/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Astro fingerprints everything under /_astro/, so those files can be
        # cached forever; a content change produces a new hash and a new URL.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # HTML is the one thing whose URL never changes when its content does,
        # so it must revalidate on every load.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/index.html =404;
        }
    }
}
