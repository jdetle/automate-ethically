# Serves the built Astro site on 8080 as the non-root nginx user.
# pid and temp paths live in /tmp because /var/run and /var/cache/nginx are
# not writable once USER nginx drops privileges.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # $http_x_forwarded_for is the real client — ACA's Envoy ingress fronts
    # this container, so $remote_addr is always the ingress hop. This log
    # format is the whole analytics pipeline for anything s10 doesn't cover:
    # pull it with `az monitor log-analytics query` and pipe into GoAccess
    # locally when curious (see docs, not run in production).
    log_format main '$http_x_forwarded_for - [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;
    sendfile on;
    tcp_nopush on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json
               image/svg+xml text/plain text/xml application/xml;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Astro fingerprints everything under /_astro/, so those files can be
        # cached forever; a content change produces a new hash and a new URL.
        location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Committed PDFs and the QR/OG images change occasionally, not never —
        # an hour and a day of staleness are both fine, a year is not.
        location /downloads/ {
            add_header Cache-Control "public, max-age=3600, must-revalidate";
            try_files $uri =404;
        }

        location /og/ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # TODO(s10 tenant): the pageview beacon in Base.astro posts here. This
        # proxies to the public ingest FQDN; if ca-automate-ethically and
        # ca-s10-ingest share the cae-platform environment, prefer internal
        # CAE DNS (http://ca-s10-ingest) once confirmed reachable — avoids an
        # unnecessary public round trip. Deliberately not called `/_s10/` or
        # otherwise obfuscated: a site arguing against unaccountable
        # automated systems should stay easy to block, not evade blockers.
        location /telemetry/ {
            proxy_pass https://ca-s10-ingest.purplewave-fe0ae338.eastus2.azurecontainerapps.io/;
            proxy_set_header Host ca-s10-ingest.purplewave-fe0ae338.eastus2.azurecontainerapps.io;
            proxy_ssl_server_name on;
        }

        # HTML is the one thing whose URL never changes when its content does,
        # so it must revalidate on every load.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/index.html =404;
        }
    }
}
